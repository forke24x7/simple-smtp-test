<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ef7628" />
    <meta name="description" content="SMTP-Verbindungen prüfen und Test-Mails senden." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Simple SMTP Test</title>
    <script>
      try {
        const theme = localStorage.getItem('smtp-theme') || 'system';
        document.documentElement.dataset.theme = theme === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>

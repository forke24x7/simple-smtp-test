services:
  simple-smtp-test:
    build:
      context: https://github.com/forke24x7/simple-smtp-test.git#main
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    init: true
    ports:
      - "${SMTP_TEST_PORT:-3008}:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(5000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
